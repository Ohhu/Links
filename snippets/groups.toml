# ── 排序方案说明 ──
# 本文件分组分为两个区域：分流分组区 与 国家块区。
#
# 一、分流分组区（文件顶部通用分组）
#   固定分组顺序：☯ AdJust → 💧 Telegram → 🌌 Assistant → 𝕏 Twitter → 🍭 Proxy
#   → 🧩 Manual → ⚡️ Google → ✨ YouTube → 💫 FCM → 🌟 GlobalMedia → 🌎 Others
#   各分组内节点引用统一序列（离中国近者在前）：
#   🪻 Residential → 🥮 HongKong → 💐 HongKong → 🌼 Korea → 🍣 Japan
#   → 🌸 Japan → 🏵 Singapore → 🧇 Germany → 🌺 SelfHost → 🍔 U.S. → 🌹 U.S.
#   例外：⚡️ Google / ✨ YouTube / 💧 Telegram 中 []🌺 SelfHost 置顶
#   []☀️ DIRECT、[]🍭 Proxy 保持各分组原位不动，正则规则保持在序列末尾
#
# 二、国家块区（中部 select 分组 + 底部 url-test 分组）
#   []🌺 SelfHost 视作美国，置于美国块最前
#   各国块按离中国距离排序：香港 → 台湾 → 韩国 → 日本 → 新加坡 → 德国 → 美国
#   同地区先食物后花卉（含被注释的备用块，启用时风格一致）
#   香港内优先级：🪻 Residential → 🥮（食物）→ 💐（花卉）
#   尾部固定为功能分组：💥 ADban → ☀️ DIRECT → 🏘 HOME
#   url-test 区域与 select 区域保持同序
# ── 排序方案说明完 ──

[[custom_groups]]
name = '☯ AdJust'
type = "select"
rule = ['[]☀️ DIRECT', '[]🍭 Proxy', '[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🌺 SelfHost', '[]🍔 U.S.', '[]🌹 U.S.', '^(?!.*自建\s*\|).*?[1-9]\.\dx$']

[[custom_groups]]
name = '💧 Telegram'
type = "select"
rule = ['[]🌺 SelfHost', '[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🍔 U.S.', '[]🌹 U.S.', '[]🍭 Proxy', '^(?!.*自建\s*\|).*?(新加坡|SGP).*?[x\d\)]$', '[]☀️ DIRECT']

[[custom_groups]]
name = '🌌 Assistant'
type = "select"
rule = ['[]🪻 Residential', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🌺 SelfHost', '[]🍔 U.S.', '[]🌹 U.S.', '[]🍭 Proxy', '^(?!.*自建\s*\|)(GPT.*?[\dx\]]$|.*?(新加坡|SGP).*?[x\d\)]$|.*?(美国|USA).*?[x\d\)]$|.*?(日本|JP).*?[x\d\)]$)']

[[custom_groups]]
name = '𝕏 Twitter'
type = "select"
rule = ['[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🌺 SelfHost', '[]🍔 U.S.', '[]🌹 U.S.', '[]🍭 Proxy', '^(?!.*自建\s*\|)(GPT.*?[\dx\]]$|.*?(香港|HK).*?[x\d\)]$|.*?(新加坡|SGP).*?[x\d\)]$|.*?(美国|USA).*?[x\d\)]$|.*?(日本|JP).*?[x\d\)]$)']

[[custom_groups]]
name = '🍭 Proxy'
type = "select"
rule = ['[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🌺 SelfHost', '[]🍔 U.S.', '[]🌹 U.S.', '[]☀️ DIRECT', '^(?!.*自建\s*\|)[^\d].*']

[[custom_groups]]
name = '🧩 Manual'
type = "select"
rule = ['[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🌺 SelfHost', '[]🍔 U.S.', '[]🌹 U.S.', '[]☀️ DIRECT', '[]🍭 Proxy', '^(?!.*自建\s*\|).*((香港|HK)|(新加坡|SGP)).*?[x\d\)]$']

[[custom_groups]]
name = '⚡️ Google'
type = "select"
rule = ['[]🌺 SelfHost', '[]🪻 Residential', '[]🥮 HongKong', '[]💐 HongKong', '[]🌼 Korea', '[]🍣 Japan', '[]🌸 Japan', '[]🏵 Singapore', '[]🧇 Germany', '[]🍔 U.S.', '[]🌹 U.S.', '[]🍭 Proxy', '^(?!.*自建\s*\|)[^\d冷].*']

[[custom_groups]]
