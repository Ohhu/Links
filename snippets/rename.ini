# 风校节点重命名规则
rename=^🇺🇸us.*-(.+?)-家宽(\d+).*@风校 🇺🇸 US 家宽-0$2 $1
rename=^🇺🇸us.*-(.+?)-(\d+).*@风校 🇺🇸 US-0$2 $1
rename=^🇺🇸us.*-(.+?)@.*@风校 🇺🇸 US $1

rename=^🇭🇰HK.*-(.+?)-(\d+).*@风校 🇭🇰 HK-0$2 $1
rename=^🇭🇰HK.*-(.+?)@.*@风校 🇭🇰 HK $1

rename=^🇯🇵JP.*-(.+?)-(\d+).*@风校 🇯🇵 JP-0$2 $1
rename=^🇯🇵JP.*-(.+?)@.*@风校 🇯🇵 JP $1

rename=^🇨🇦CA.*-(.+?)-(\d+).*@风校 🇨🇦 CA-0$2 $1
rename=^🇨🇦CA.*-(.+?)@.*@风校 🇨🇦 CA $1

rename=^🇲🇩MD.*-(.+?)@.*@风校 🇲🇩 MD $1
rename=^🇮🇳IN.*-(.+?)@.*@风校 🇮🇳 IN $1
rename=^🇬🇧GB.*-(.+?)@.*@风校 🇬🇧 GB $1
rename=^🇩🇪DE.*-(.+?)@.*@风校 🇩🇪 DE $1

# 宝可梦节点重命名规则
rename=^.*?】(.+?)(家宽)?\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 $1$2 $3 $4x
rename=^hk.*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇭🇰 $1 $2 $3x
rename=^jp.*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇯🇵 $1 $2 $3x
rename=^us.*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇺🇸 $1 $2 $3x
rename=^s[gs].*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇸🇬 $1 $2 $3x
rename=^tw.*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇹🇼 $1 $2 $3x
rename=^[ek]x.*?】(.+?)\d+.*?([直连|专线|AWS|V6|IPLC]).*(\d+)倍$@宝可梦 🇰🇷 $1 $2 $3x
